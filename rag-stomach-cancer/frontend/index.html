<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gastric Cancer Case RAG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, sans-serif; }
  body { display: flex; height: 100vh; background: #343541; color: #ececf1; }

  #sidebar { width: 260px; background: #202123; display: flex; flex-direction: column; padding: 10px; }
  #new-chat-btn { padding: 12px; border: 1px solid #565869; border-radius: 8px; background: transparent;
    color: #ececf1; cursor: pointer; margin-bottom: 10px; text-align: left; }
  #new-chat-btn:hover { background: #2b2c2f; }
  #session-list { flex: 1; overflow-y: auto; }
  .session-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; }
  .session-item:hover { background: #2b2c2f; }
  .session-item.active { background: #343541; }
  .delete-btn { opacity: 0; cursor: pointer; color: #999; }
  .session-item:hover .delete-btn { opacity: 1; }

  #main { flex: 1; display: flex; flex-direction: column; }
  #chat-window { flex: 1; overflow-y: auto; padding: 20px; }
  .message { max-width: 700px; margin: 0 auto 20px; padding: 16px; border-radius: 8px; line-height: 1.5; }
  .message.user { background: #444654; }
  .message.assistant { background: #343541; border: 1px solid #444654; }
  .role-label { font-size: 12px; color: #8e8ea0; margin-bottom: 6px; }
  .sources { margin-top: 10px; font-size: 12px; color: #8e8ea0; }
  .sources span { background: #444654; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }

  #input-area { padding: 20px; display: flex; justify-content: center; }
  #input-box { width: 100%; max-width: 700px; display: flex; gap: 10px; }
  #message-input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #565869;
    background: #40414f; color: #ececf1; font-size: 15px; resize: none; }
  #send-btn { padding: 0 20px; border: none; border-radius: 8px; background: #19c37d;
    color: white; cursor: pointer; font-weight: bold; }
  #send-btn:disabled { background: #565869; cursor: not-allowed; }
  .typing { color: #8e8ea0; font-style: italic; }
</style>
</head>
<body>

<div id="sidebar">
  <button id="new-chat-btn">+ New chat</button>
  <div id="session-list"></div>
</div>

<div id="main">
  <div id="chat-window"></div>
  <div id="input-area">
    <div id="input-box">
      <textarea id="message-input" rows="1" placeholder="Ask about a gastric cancer case..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
// Same-origin: FastAPI serves this file and the /api routes together.
const API = "/api";
let currentSessionId = null;

async function loadSessions() {
  const res = await fetch(`${API}/sessions`);
  const sessions = await res.json();
  const list = document.getElementById("session-list");
  list.innerHTML = "";
  sessions.forEach(s => {
    const item = document.createElement("div");
    item.className = "session-item" + (s.id === currentSessionId ? " active" : "");
    item.innerHTML = `<span>${s.title}</span><span class="delete-btn" data-id="${s.id}">✕</span>`;
    item.querySelector("span").onclick = () => openSession(s.id);
    item.querySelector(".delete-btn").onclick = async (e) => {
      e.stopPropagation();
      await fetch(`${API}/sessions/${s.id}`, { method: "DELETE" });
      if (s.id === currentSessionId) { currentSessionId = null; document.getElementById("chat-window").innerHTML = ""; }
      loadSessions();
    };
    list.appendChild(item);
  });
}

async function openSession(sessionId) {
  currentSessionId = sessionId;
  const res = await fetch(`${API}/sessions/${sessionId}/messages`);
  const messages = await res.json();
  const win = document.getElementById("chat-window");
  win.innerHTML = "";
  messages.forEach(m => renderMessage(m.role, m.content, JSON.parse(m.sources || "[]")));
  loadSessions();
}

function renderMessage(role, content, sources = []) {
  const win = document.getElementById("chat-window");
  const div = document.createElement("div");
  div.className = `message ${role}`;
  let sourcesHtml = "";
  if (sources.length) {
    sourcesHtml = `<div class="sources">Sources: ${sources.map(s => `<span>${s}</span>`).join("")}</div>`;
  }
  div.innerHTML = `<div class="role-label">${role === "user" ? "You" : "Assistant"}</div>
                    <div>${content.replace(/\n/g, "<br>")}</div>${sourcesHtml}`;
  win.appendChild(div);
  win.scrollTop = win.scrollHeight;
  return div;
}

document.getElementById("new-chat-btn").onclick = async () => {
  const res = await fetch(`${API}/sessions`, { method: "POST" });
  const data = await res.json();
  currentSessionId = data.session_id;
  document.getElementById("chat-window").innerHTML = "";
  loadSessions();
};

async function sendMessage() {
  const input = document.getElementById("message-input");
  const text = input.value.trim();
  if (!text) return;

  if (!currentSessionId) {
    const res = await fetch(`${API}/sessions`, { method: "POST" });
    const data = await res.json();
    currentSessionId = data.session_id;
  }

  renderMessage("user", text);
  input.value = "";
  document.getElementById("send-btn").disabled = true;

  const typingDiv = renderMessage("assistant", '<span class="typing">Thinking...</span>');

  try {
    const res = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: currentSessionId, message: text }),
    });
    const data = await res.json();
    typingDiv.remove();
    renderMessage("assistant", data.answer, data.sources);
  } catch (err) {
    typingDiv.remove();
    renderMessage("assistant", "Error: could not reach the backend.");
  }

  document.getElementById("send-btn").disabled = false;
  loadSessions();
}

document.getElementById("send-btn").onclick = sendMessage;
document.getElementById("message-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadSessions();
</script>
</body>
</html>
